{% extends "base.html" %}

{% block title %}Login - Sistema Jurídico{% endblock %}

{% block content %}
    <h1>🔐 Login</h1>
    <!-- Corrigido o nome do endpoint -->
    <form action="{{ url_for('routes.cli_login') }}" method="POST" class="login-form">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required>

        <button class="submit" onclick="contatos()">
                <h2>Entrar</h2>
            </button>

        <a href="{{ url_for('routes.cli_cadastro') }}" class="btn-cadastrar">Não tenho Conta</a>

        
    </form>
{% endblock %}
