{% extends "base.html" %}

{% block title %}Login - Sistema Jurídico{% endblock %}

{% block content %}
    <h1>🔐 Cadastro</h1>
    <!-- Corrigido o nome do endpoint -->
    <form action="{{ url_for('routes.cli_cadastro') }}" method="POST" class="login-form">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome" required>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required>

        <button type="submit">Cadastrar</button>

        <p style="margin-top: 15px;">
            Já tem conta? <a href="{{ url_for('routes.cli_login') }}">Faça login aqui</a>
    </form>
{% endblock %}
